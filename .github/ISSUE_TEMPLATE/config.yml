blank_issues_enabled: false
contact_links:
  - name: Using the plugin — read Troubleshooting first
    url: https://github.com/raulogm077/appian-harness#troubleshooting
    about: >-
      Why a gate asked, why the hooks do nothing, why the installed copy is
      behind the repository, how to drive the scope gate to allow. Most usage
      questions are answered there already.
  - name: Ask a question
    url: https://github.com/raulogm077/appian-harness/discussions
    about: >-
      Discussions, not issues. If that link 404s, the feature is not enabled on
      this repository yet — open the bug form and say in it that you are asking
      a question rather than reporting a defect.
  - name: Security issue
    url: https://github.com/raulogm077/appian-harness/blob/main/SECURITY.md
    about: >-
      The plugin executes code on your machine in six hook entries. Report
      anything about that surface by email, never in a public issue — SECURITY.md
      has the address and the response times.
