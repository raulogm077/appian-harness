name: checks

# The plugin argued for a long time that nothing checked is not a pass, while
# its own checks ran only when somebody remembered. `lint_skills.py` in
# particular claims its exemption list cannot be bypassed -- true only while
# someone runs it. This is that claim becoming true.
#
# Both platforms on purpose. `isfile_exact` exists because NTFS and APFS are
# case-insensitive and ext4 is not, so a verdict named `practices-QA.json`
# closes a task on a laptop and blocks it in CI. A harness that behaves
# differently in two places is worse than either behaviour consistently, and
# a single-platform CI would have let exactly that back in.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The floor is what the hooks must survive, not what a developer
        # happens to have: they run under whatever interpreter the launcher
        # finds on the machine, which is rarely the newest.
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Hooks — gates, launcher, verdict freshness, destructive guard
        run: python -m unittest discover -s hooks -v

      - name: Scripts — validator, checkers, skill linter, parallel safety
        run: python -m unittest discover -s scripts -v

      - name: Skill frontmatter lint
        run: python scripts/lint_skills.py

      # The three agents are as much the product as the seven skills, and for
      # four releases nothing looked at them: lint_skills.py walks skills/ and
      # stops. An agent's description decides whether it is ever dispatched,
      # which is the same job a skill description does and was going unjudged.
      - name: Agent frontmatter lint
        run: python scripts/lint_agents.py

      # Counts in prose drift. This plugin's drifted three times in one
      # working session -- hooks, skills, test totals -- and a reader caught
      # it every time, a check caught it never. It is a script rather than an
      # inline step so the same check runs locally, before CI, which is where
      # drift is cheap to fix.
      - name: README's self-description matches the tree
        run: python scripts/check_readme_claims.py

      # The marketplace entry sat three releases behind plugin.json without
      # anything noticing, because nothing at install time reads it -- plugin.json
      # wins and the entry version is silently ignored. What does read it is
      # `claude plugin tag`, which refuses to tag a release whose manifests
      # disagree, so the drift was invisible right up until it would have blocked
      # a release. Not a call to `claude plugin validate`: CI has no CLI, and a
      # check that only runs where the CLI happens to be installed is the same
      # absent-gate problem run_hook.sh exists to prevent.
      - name: The two manifests declare the same version
        run: python scripts/check_manifest_agreement.py

      # Every test here imports harness_hooks.py directly, which proves the
      # program is correct and says nothing about whether Claude Code can start
      # it. hooks.json names paths; a hook whose command cannot be found does not
      # ask and does not block -- it does not run, and the plugin installs, looks
      # healthy and enforces nothing.
      - name: Everything the manifests reference is in the tree
        run: python scripts/check_package_integrity.py

      # `claude plugin eval` is in early access and has never scored these cases.
      # What can be checked without the runner is that a case has something
      # scoring it, and that the something is not a copy of the prompt -- a
      # grader that rewards the prompt's vocabulary scores well while the task
      # goes undone, which is the confident green this plugin argues against.
      - name: Eval cases are well-formed
        run: python scripts/check_evals.py

      # No step here re-checks that the deferrable list in the document and
      # in `DEFERRABLE_CRITERIA` agree, or that every reference file has
      # citable anchors. Both are already unit tests
      # (`test_the_document_and_the_constant_name_the_same_criteria` and the
      # reference-resolution tests), and a CI step restating a test is one
      # more copy to drift -- the exact failure this plugin spends a section
      # arguing against.

      - name: The plugin ships no project state of its own
        shell: python
        run: |
            import os, sys
            # Plugin and project are separate layers. Harness state inside
            # this repository would mean the plugin had started governing
            # itself, which is the contamination the separation prevents.
            #
            # Named precisely rather than by directory. `.claude/` also
            # holds editor artifacts like settings.local.json, and flagging
            # those would make this cry wolf -- a check people learn to
            # scroll past protects nothing, which is the same argument the
            # session-start check makes about unknown MCP configuration.
            leaked = [p for p in (
                os.path.join(".claude", "appian-harness.json"),
                "evidence",
                "tasks",
            ) if os.path.exists(p)]
            if leaked:
                sys.exit("harness project state leaked into the plugin: %s" % leaked)
            print("plugin/project separation intact")
