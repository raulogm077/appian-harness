<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1012" viewBox="0 0 880 1012" role="img" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<title>One task through the harness: build, verify and review write verdicts; the closure gate reads them on Stop while the active task file is in flight</title>
<defs><marker id="ar-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"/></marker></defs>
<defs><marker id="ar-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"/></marker></defs>
<defs><marker id="ar-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#c3c2b7"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="1011" rx="10" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="28" y="36" font-size="15" fill="#ffffff" font-weight="600">One task through the harness</text>
<text x="28" y="54" font-size="12" fill="#c3c2b7">A person invokes each phase; chaining them in one run loses the checkpoints that catch bad direction.</text>
<rect x="742" y="22" width="10" height="10" rx="2" fill="#3987e5" stroke="none" stroke-width="0"/>
<text x="758" y="31" font-size="11" fill="#c3c2b7">skills act</text>
<rect x="742" y="38" width="10" height="10" rx="2" fill="#d95926" stroke="none" stroke-width="0"/>
<text x="758" y="47" font-size="11" fill="#c3c2b7">hooks gate</text>
<rect x="742" y="54" width="10" height="10" rx="2" fill="#199e70" stroke="none" stroke-width="0"/>
<text x="758" y="63" font-size="11" fill="#c3c2b7">state on disk</text>
<rect x="104" y="96" width="560" height="88" rx="6" fill="rgba(57,135,229,0.13)" stroke="#3987e5" stroke-width="1.25"/>
<text x="118" y="120" font-size="13" fill="#ffffff" font-weight="600">SPECIFY — appian-specify</text>
<text x="118" y="140" font-size="11.5" fill="#c3c2b7">one question at a time → a written specification: actors, entities, states and</text>
<text x="118" y="156" font-size="11.5" fill="#c3c2b7">transitions, an authorization matrix, volume, and an explicit out of scope</text>
<text x="118" y="172" font-size="11" fill="#898781">read by a person — no Appian object exists yet for a gate to have an opinion about</text>
<rect x="104" y="200" width="560" height="104" rx="6" fill="rgba(57,135,229,0.13)" stroke="#3987e5" stroke-width="1.25"/>
<text x="118" y="224" font-size="13" fill="#ffffff" font-weight="600">PLAN — appian-plan</text>
<text x="118" y="244" font-size="11.5" fill="#c3c2b7">cuts the specification into vertical slices — record type → query rule → interface →</text>
<text x="118" y="260" font-size="11.5" fill="#c3c2b7">test case — ordered by the dependencies Appian actually imposes</text>
<text x="118" y="276" font-size="11.5" fill="#c3c2b7">writes two files: the plan (approved, stable) + operational state (changes every task)</text>
<text x="118" y="292" font-size="11.5" fill="#c3c2b7">each task: <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">allowedObjects</tspan> · <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">acceptanceCriteria</tspan> · <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">requiredGates</tspan> · <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">evidenceFile</tspan> (+ <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">risk</tspan>)</text>
<rect x="88" y="332" width="600" height="520" rx="10" fill="none" stroke="#2c2c2a" stroke-width="1.25" stroke-dasharray="6 4"/>
<text x="112" y="352" font-size="10.5" fill="#898781">per TASK — repeated until the plan is done · /appian-run sequences it, authorized once and bounded</text>
<rect x="104" y="360" width="560" height="184" rx="6" fill="rgba(57,135,229,0.13)" stroke="#3987e5" stroke-width="1.25"/>
<text x="118" y="384" font-size="13" fill="#ffffff" font-weight="600">BUILD — appian-build · exactly one approved task, then stop</text>
<text x="118" y="404" font-size="11.5" fill="#c3c2b7">1. takes the task: writes <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">tasks/current.json</tspan> with its id and allowedObjects</text>
<text x="118" y="422" font-size="11.5" fill="#c3c2b7">2. preflight — reads the real environment; the remote state wins (all reads, no gate)</text>
<text x="118" y="440" font-size="11.5" fill="#c3c2b7">3. design audit before the first write → <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">evidence/&lt;task&gt;/practices-design.json</tspan></text>
<text x="118" y="460" font-size="11.5" fill="#c3c2b7">4. writes, through the design MCP — and the hooks fire on every call</text>
<rect x="128" y="470" width="512" height="60" rx="6" fill="rgba(217,89,38,0.13)" stroke="#d95926" stroke-width="1.25"/>
<text x="140" y="488" font-size="10.5" fill="#c3c2b7">scope gate, PreToolUse — active task, object allowed, atomicity, skill-load record, passing</text>
<text x="140" y="503" font-size="10.5" fill="#c3c2b7">design verdict; every failure reported at once, and the strongest answer is ask</text>
<text x="140" y="518" font-size="10.5" fill="#c3c2b7">write log appends <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace" font-size="10">operations.jsonl</tspan> · on error, the failure notice: read back, never retry blind</text>
<rect x="104" y="556" width="560" height="48" rx="6" fill="rgba(217,89,38,0.13)" stroke="#d95926" stroke-width="1.5"/>
<text x="118" y="576" font-size="11.5" fill="#ffffff" font-weight="600">the builder's stop is BLOCKED — the closure gate names the three verdicts that</text>
<text x="118" y="592" font-size="11.5" fill="#ffffff" font-weight="600">do not exist yet · the block is the handoff into VERIFY, not a failure</text>
<rect x="104" y="616" width="560" height="104" rx="6" fill="rgba(57,135,229,0.13)" stroke="#3987e5" stroke-width="1.25"/>
<text x="118" y="640" font-size="13" fill="#ffffff" font-weight="600">VERIFY — appian-verify · a fresh context; the builder never certifies</text>
<text x="118" y="660" font-size="11.5" fill="#c3c2b7">auditor, phase=implementation → <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">evidence/&lt;task&gt;/practices-implementation.json</tspan></text>
<text x="118" y="676" font-size="11.5" fill="#c3c2b7">renders twice — against real data, and against the identifier guaranteed empty</text>
<text x="118" y="692" font-size="11.5" fill="#c3c2b7">auditor, phase=qa → <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">practices-qa.json</tspan> · appian-verifier: one result per required gate</text>
<text x="118" y="708" font-size="11.5" fill="#c3c2b7">everything consolidated into <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">evidence/&lt;task&gt;/gates.md</tspan> — one account, not three</text>
<rect x="104" y="732" width="560" height="104" rx="6" fill="rgba(57,135,229,0.13)" stroke="#3987e5" stroke-width="1.25"/>
<text x="118" y="756" font-size="13" fill="#ffffff" font-weight="600">REVIEW — appian-review · graduated by risk, from a clean context</text>
<text x="118" y="776" font-size="11.5" fill="#c3c2b7">appian-reviewer: artifact vs contract — never handed the builder's conclusion</text>
<text x="118" y="792" font-size="11.5" fill="#c3c2b7">the auditor, phase=review: the change vs doctrine → <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">practices-review.json</tspan></text>
<text x="118" y="808" font-size="11.5" fill="#c3c2b7">a change can be found exempt — deciding that is review's work, and it is recorded</text>
<text x="118" y="824" font-size="11.5" fill="#ffffff" font-weight="600">last act — deletes <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">tasks/current.json</tspan>: the recorded act of closing the task</text>
<rect x="104" y="876" width="560" height="108" rx="6" fill="rgba(217,89,38,0.13)" stroke="#d95926" stroke-width="1.25"/>
<text x="118" y="900" font-size="13" fill="#ffffff" font-weight="600">CLOSE — not a skill: the closure gate, on Stop</text>
<text x="118" y="920" font-size="11.5" fill="#c3c2b7">task in flight → the stop needs valid, passing verdicts for the risk tier:</text>
<text x="118" y="936" font-size="11.5" fill="#c3c2b7">implementation for trivial; + review + qa for standard — none older than the last write</text>
<text x="118" y="952" font-size="11.5" fill="#c3c2b7">it blocks once; a repeat stop approves and records the omission to <tspan font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">deferred-debt.jsonl</tspan></text>
<text x="118" y="968" font-size="11" fill="#898781">nothing in flight → approves without opening anything — why review, not build, deletes the file</text>
<polyline points="68,134 68,208" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<polyline points="68,238 68,368" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<polyline points="68,398 68,624" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<polyline points="68,654 68,740" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<polyline points="68,770 68,884" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<circle cx="68" cy="120" r="12" fill="#3987e5"/>
<text x="68" y="124" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">1</text>
<circle cx="68" cy="224" r="12" fill="#3987e5"/>
<text x="68" y="228" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<circle cx="68" cy="384" r="12" fill="#3987e5"/>
<text x="68" y="388" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<circle cx="68" cy="640" r="12" fill="#3987e5"/>
<text x="68" y="644" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<circle cx="68" cy="756" r="12" fill="#3987e5"/>
<text x="68" y="760" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<circle cx="68" cy="900" r="12" fill="#d95926"/>
<text x="68" y="904" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<rect x="61" y="573" width="14" height="14" fill="#d95926" transform="rotate(45 68 580)"/>
<polyline points="664,404 706,404" fill="none" stroke="#199e70" stroke-width="1.1" stroke-dasharray="2 3"/>
<polyline points="664,824 706,824" fill="none" stroke="#199e70" stroke-width="1.1" stroke-dasharray="2 3"/>
<rect x="706" y="404" width="12" height="420" rx="6" fill="rgba(25,158,112,0.12)" stroke="#199e70" stroke-width="1.25"/>
<text x="726" y="400" font-size="10.5" fill="#c3c2b7">created by</text>
<text x="726" y="414" font-size="10.5" fill="#c3c2b7" font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">appian-build</text>
<text x="726" y="580" font-size="11" fill="#ffffff" font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">tasks/current.json</text>
<text x="726" y="597" font-size="11" fill="#c3c2b7">exists — the task is</text>
<text x="726" y="612" font-size="11" fill="#c3c2b7">in flight: this window</text>
<text x="726" y="627" font-size="11" fill="#c3c2b7">is the closure gate's</text>
<text x="726" y="642" font-size="11" fill="#c3c2b7">whole reach</text>
<text x="726" y="814" font-size="10.5" fill="#c3c2b7">deleted by</text>
<text x="726" y="828" font-size="10.5" fill="#c3c2b7" font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">appian-review —</text>
<text x="726" y="842" font-size="10.5" fill="#c3c2b7">the recorded close</text>
</svg>
