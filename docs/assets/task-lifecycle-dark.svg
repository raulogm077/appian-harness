<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1012" viewBox="0 0 880 1012" role="img" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<title>One scope through the harness: the size announced before anything opens, one permission for the whole scope, the build, the reviewer the lane bought, and the hook that writes the close</title>
<defs><marker id="ar-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"/></marker></defs>
<defs><marker id="ar-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"/></marker></defs>
<defs><marker id="ar-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#c3c2b7"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="1011" rx="10" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="28" y="36" font-size="15" fill="#ffffff" font-weight="600">One scope through the harness</text>
<text x="28" y="54" font-size="12" fill="#c3c2b7">The size is announced before anything opens, the permission is asked once, and the hook writes the close.</text>
<rect x="742" y="22" width="10" height="10" rx="2" fill="#3987e5" stroke="none" stroke-width="0"/>
<text x="758" y="31" font-size="11" fill="#c3c2b7">skills act</text>
<rect x="742" y="38" width="10" height="10" rx="2" fill="#d95926" stroke="none" stroke-width="0"/>
<text x="758" y="47" font-size="11" fill="#c3c2b7">hooks gate</text>
<rect x="742" y="54" width="10" height="10" rx="2" fill="#199e70" stroke="none" stroke-width="0"/>
<text x="758" y="63" font-size="11" fill="#c3c2b7">state on disk</text>
<rect x="104" y="96" width="560" height="88" rx="6" fill="rgba(57,135,229,0.13)" stroke="#3987e5" stroke-width="1.25"/>
<text x="118" y="120" font-size="13" fill="#ffffff" font-weight="600">ROUTE — appian-build, and it is the only entry point</text>
<text x="118" y="140" font-size="11.5" fill="#c3c2b7">it classifies before it opens anything, in one line the person can contradict on the spot:</text>
<text x="118" y="156" font-size="11.5" fill="#c3c2b7">micro — one object, one intention — or task, which is everything else</text>
<text x="118" y="172" font-size="11" fill="#898781">no magnitude threshold: redesigning a 1,767-line interface is still one object, one intention</text>
<rect x="104" y="200" width="560" height="104" rx="6" fill="rgba(57,135,229,0.13)" stroke="#3987e5" stroke-width="1.25" stroke-dasharray="6 4"/>
<text x="118" y="224" font-size="13" fill="#ffffff" font-weight="600">SPECIFY and PLAN — only when they buy something</text>
<text x="118" y="244" font-size="11.5" fill="#c3c2b7">appian-specify closes absent requirements by interview, and only when the sentence names</text>
<text x="118" y="260" font-size="11.5" fill="#c3c2b7">a business entity that does not exist yet</text>
<text x="118" y="276" font-size="11.5" fill="#c3c2b7">appian-plan cuts the work into tasks with a cap, acceptance criteria per task and waves —</text>
<text x="118" y="292" font-size="11.5" fill="#c3c2b7">only for several features, or real dependencies</text>
<rect x="104" y="320" width="560" height="76" rx="6" fill="rgba(217,89,38,0.13)" stroke="#d95926" stroke-width="1.25"/>
<text x="118" y="344" font-size="13" fill="#ffffff" font-weight="600">PERMISSION — asked once, for the whole scope</text>
<text x="118" y="364" font-size="11.5" fill="#c3c2b7">the full list of objects, and what is going to happen to each one; at most one extension</text>
<text x="118" y="380" font-size="11.5" fill="#c3c2b7">per remediation</text>
<rect x="104" y="412" width="560" height="170" rx="6" fill="rgba(57,135,229,0.13)" stroke="#3987e5" stroke-width="1.25"/>
<text x="118" y="436" font-size="13" fill="#ffffff" font-weight="600">BUILD — appian-build opens the scope and writes</text>
<text x="118" y="456" font-size="11.5" fill="#c3c2b7">1. opens the scope: which objects may be touched, and what for</text>
<text x="118" y="474" font-size="11.5" fill="#c3c2b7">2. preflight — it reads the real environment, and the remote state wins</text>
<text x="118" y="492" font-size="11.5" fill="#c3c2b7">3. the judge, design → evidence/…/practices-design.json</text>
<text x="118" y="510" font-size="11.5" fill="#c3c2b7">4. writes, through the declared perimeter — and the hooks fire on every call</text>
<rect x="128" y="520" width="512" height="56" rx="6" fill="rgba(217,89,38,0.13)" stroke="#d95926" stroke-width="1.25"/>
<text x="140" y="538" font-size="10.5" fill="#c3c2b7">scope gate, PreToolUse on both Appian servers — signed state, contract, minimum size and</text>
<text x="140" y="553" font-size="10.5" fill="#c3c2b7">grant coverage; every reason at once, and the strongest answer is ask, never deny</text>
<text x="140" y="568" font-size="10.5" fill="#c3c2b7">write log appends operations.jsonl · on failure, read back what persisted — no blind retry</text>
<rect x="104" y="598" width="560" height="104" rx="6" fill="rgba(57,135,229,0.13)" stroke="#3987e5" stroke-width="1.25"/>
<text x="118" y="622" font-size="13" fill="#ffffff" font-weight="600">REVIEW — appian-review, when the lane bought a reviewer</text>
<text x="118" y="642" font-size="11.5" fill="#c3c2b7">exposure buys a reviewer, not a size: an object reachable from a published site is one</text>
<text x="118" y="658" font-size="11.5" fill="#c3c2b7">object, one intention — with a reviewer</text>
<text x="118" y="674" font-size="11.5" fill="#c3c2b7">the judge, certify → practices-certify.json, handed the artifact and the contract and</text>
<text x="118" y="690" font-size="11.5" fill="#c3c2b7">never the builder's conclusion. The skill certifies and asks for the close</text>
<rect x="104" y="718" width="560" height="122" rx="6" fill="rgba(217,89,38,0.13)" stroke="#d95926" stroke-width="1.25"/>
<text x="118" y="742" font-size="13" fill="#ffffff" font-weight="600">CLOSE — not a skill: the hook writes the state, and signs it</text>
<text x="118" y="762" font-size="11.5" fill="#c3c2b7">the agent asks through its own channel; the hook validates the transition, signs it, and</text>
<text x="118" y="778" font-size="11.5" fill="#c3c2b7">reverts any state written by hand</text>
<text x="118" y="794" font-size="11.5" fill="#ffffff" font-weight="600">three ways out, and the person sees all three: close · abandon, with a reason · desist,</text>
<text x="118" y="810" font-size="11.5" fill="#ffffff" font-weight="600">which leaves it exactly as it is</text>
<text x="118" y="828" font-size="11" fill="#898781">an instrument that failed never changes the size: it closes closed-pending-human, still micro</text>
<rect x="104" y="856" width="560" height="76" rx="6" fill="rgba(25,158,112,0.12)" stroke="#199e70" stroke-width="1.25"/>
<text x="118" y="878" font-size="12.5" fill="#ffffff" font-weight="600">The scope is in exactly one of seven states, and there are no others</text>
<text x="118" y="898" font-size="11.5" fill="#c3c2b7" font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">in-flight · closing · closed · closed-pending-human</text>
<text x="118" y="914" font-size="11.5" fill="#c3c2b7" font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">closed-with-debt · suspended · abandoned</text>
<polyline points="68,132 68,212" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<polyline points="68,236 68,332" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<polyline points="68,356 68,424" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<polyline points="68,448 68,610" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<polyline points="68,634 68,730" fill="none" stroke="#c3c2b7" stroke-width="1.2" marker-end="url(#ar-ink)"/>
<circle cx="68" cy="120" r="12" fill="#3987e5"/>
<text x="68" y="124" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">1</text>
<circle cx="68" cy="224" r="12" fill="#3987e5"/>
<text x="68" y="228" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<circle cx="68" cy="344" r="12" fill="#d95926"/>
<text x="68" y="348" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<circle cx="68" cy="436" r="12" fill="#3987e5"/>
<text x="68" y="440" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<circle cx="68" cy="622" r="12" fill="#3987e5"/>
<text x="68" y="626" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<circle cx="68" cy="742" r="12" fill="#d95926"/>
<text x="68" y="746" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<polyline points="664,436 706,436" fill="none" stroke="#199e70" stroke-width="1.1" stroke-dasharray="2 3"/>
<polyline points="664,762 706,762" fill="none" stroke="#199e70" stroke-width="1.1" stroke-dasharray="2 3"/>
<rect x="706" y="436" width="12" height="326" rx="6" fill="rgba(25,158,112,0.12)" stroke="#199e70" stroke-width="1.25"/>
<text x="726" y="432" font-size="10.5" fill="#c3c2b7">opened by</text>
<text x="726" y="446" font-size="10.5" fill="#c3c2b7" font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">appian-build</text>
<text x="726" y="584" font-size="11" fill="#ffffff" font-family="ui-monospace,Consolas,'Cascadia Mono',monospace">tasks/current.json</text>
<text x="726" y="601" font-size="11" fill="#c3c2b7">one scope: what may</text>
<text x="726" y="616" font-size="11" fill="#c3c2b7">be touched and what</text>
<text x="726" y="631" font-size="11" fill="#c3c2b7">for. The schema is</text>
<text x="726" y="646" font-size="11" fill="#c3c2b7">closed — a field it</text>
<text x="726" y="661" font-size="11" fill="#c3c2b7">does not declare is</text>
<text x="726" y="676" font-size="11" fill="#c3c2b7">rejected, not ignored</text>
<text x="726" y="752" font-size="10.5" fill="#c3c2b7">closed by</text>
<text x="726" y="766" font-size="10.5" fill="#c3c2b7">the hook, signed —</text>
<text x="726" y="780" font-size="10.5" fill="#c3c2b7">never by the skill</text>
<text x="28" y="962" font-size="10.5" fill="#898781">scope · size · permission · close · debt · expiry — the six words the harness asks a person to know.</text>
<text x="28" y="980" font-size="10.5" fill="#898781">Everything else it keeps for itself: the identifiers, the sequence numbers and the gate classes live in files and appear in no line a person reads.</text>
</svg>
